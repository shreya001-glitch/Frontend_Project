<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
</head>
<body>
    <h1>Student Marksheet</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th colspan="5">Student Marksheet</th>
        </tr>
        <tr>
            <th>Subject</th>
            <th>Max Marks</th>
            <th>Marks Obtained</th>
            <th>Grade</th>
            <th>Result</th>
        </tr>
        <tr>
            <td>Web Development</td>
            <td>100</td>
            <td>88</td>
            <td>A</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>Java</td>
            <td>100</td>
            <td>82</td>
            <td>A</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>91</td>
            <td>A+</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>Python</td>
            <td>100</td>
            <td>85</td>
            <td>A</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>Database</td>
            <td>100</td>
            <td>79</td>
            <td>B+</td>
            <td>Pass</td>
        </tr>
        <tr>
            <th>Total</th>
            <th>500</th>
            <th>425</th>
            <th>A</th>
            <th>Pass</th>
        </tr>
    </table>
</body>
</html>
